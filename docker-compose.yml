services:
  chromadb:
    image: chromadb/chroma:0.5.0
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      - chromadb
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_NAME: qwen3.5:0.8b
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  chroma_data:
  uploads:
