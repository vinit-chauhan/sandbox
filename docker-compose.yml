# Backend reaches Ollama on host via host.docker.internal.
# Ollama must listen on 0.0.0.0: set OLLAMA_HOST=0.0.0.0 before starting Ollama.

services:
  chromadb:
    image: chromadb/chroma:0.5.0
    volumes:
      - ./data/chroma_data:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      - chromadb
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_NAME: qwen3.5:4b
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads:
