# Backend reaches Ollama/MLX on host via host.docker.internal.
# Ollama: set OLLAMA_HOST=0.0.0.0, or use ./scripts/start-ollama.sh
# MLX:    start with ./scripts/start-mlx.sh
#
# LLM_PROVIDER: "ollama" (default), "mlx" (Apple Silicon), or "gemini" (cloud)

services:
  chromadb:
    image: chromadb/chroma:0.5.0
    volumes:
      - ./data/chroma_data:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      - chromadb
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      MLX_BASE_URL: http://host.docker.internal
      MLX_PORT: ${MLX_PORT:-8080}
      MLX_MODEL: ${MLX_MODEL:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_NAME: ${MODEL_NAME:-qwen3.5:4b}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads:
