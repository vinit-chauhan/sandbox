services:
  ollama:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    environment:
      MODEL_NAME: qwen2.5:3b
    # GPU (optional — uncomment for NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:0.5.0
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./backend
    depends_on:
      - ollama
      - chromadb
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_NAME: qwen2.5:3b
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  ollama_data:
  chroma_data:
  uploads:
